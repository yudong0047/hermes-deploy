<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16213e; padding: 15px 20px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 10px; }
        .header h1 { font-size: 18px; color: #00d9ff; }
        .status { margin-left: auto; font-size: 12px; padding: 4px 12px; border-radius: 12px; background: #0f3460; }
        .status.connected { color: #00ff88; }
        .status.error { color: #ff6b6b; }
        .status.testing { color: #ffaa00; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; background: #00d9ff; color: #000; border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; border-bottom-left-radius: 4px; white-space: pre-wrap; }
        .message.error { background: #ff6b6b; color: #fff; align-self: center; max-width: 90%; }
        .message.system { background: #ffaa00; color: #000; align-self: center; max-width: 90%; font-size: 12px; }
        .typing { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 4px; }
        .typing span { display: inline-block; width: 8px; height: 8px; background: #00d9ff; border-radius: 50%; margin-right: 4px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .input-area { background: #16213e; padding: 15px 20px; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #0f3460; border: none; padding: 12px 16px; border-radius: 24px; color: #fff; font-size: 14px; outline: none; }
        .input-area input:focus { box-shadow: 0 0 0 2px #00d9ff; }
        .input-area button { background: #00d9ff; border: none; padding: 12px 24px; border-radius: 24px; color: #000; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .input-area button:hover { background: #00b8d9; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Hermes Chat</h1>
        <span class="status" id="status">初始化中...</span>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message assistant">系统初始化中，请稍候...</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)" disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
    </div>
    
    <script>
        const API_URL = 'https://tmp-flags-solely-therefore.trycloudflare.com/v1/chat/completions';
        const API_KEY = 'hermes-api-key-2026';
        const MODEL = 'google/gemma-4-26b-a4b-it:free';
        
        let messages = [];
        let isTyping = false;
        let connectionStatus = 'testing';
        
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');
        
        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = 'status ' + (cls || '');
        }
        
        function addMessage(content, type) {
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            msg.textContent = content;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function enableUI() {
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }
        
        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }
        
        async function testConnection() {
            setStatus('连接中...', 'testing');
            
            try {
                // 测试 API
                const testPayload = {
                    model: MODEL,
                    messages: [{ role: 'user', content: 'hi' }],
                    max_tokens: 5
                };
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify(testPayload)
                });
                
                if (response.ok || response.status === 400) {
                    setStatus('已连接', 'connected');
                    connectionStatus = 'ok';
                    
                    // 清空初始化消息
                    chatContainer.innerHTML = '';
                    addMessage('你好！我是 Hermes AI 助手。有什么我可以帮助你的吗？', 'assistant');
                    enableUI();
                } else {
                    throw new Error('HTTP ' + response.status);
                }
            } catch (error) {
                console.error('Connection error:', error);
                setStatus('连接失败', 'error');
                addMessage('连接失败: ' + error.message + '\n\n请检查网络或服务器状态。', 'error');
            }
        }
        
        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isTyping) return;
            
            addMessage(content, 'user');
            messages.push({ role: 'user', content });
            messageInput.value = '';
            
            isTyping = true;
            sendBtn.disabled = true;
            showTyping();
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: messages,
                        max_tokens: 2000
                    })
                });
                
                hideTyping();
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || '请求失败 (HTTP ' + response.status + ')');
                }
                
                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || '没有收到回复';
                
                addMessage(reply, 'assistant');
                messages.push({ role: 'assistant', content: reply });
                
            } catch (error) {
                hideTyping();
                addMessage('错误: ' + error.message, 'error');
            } finally {
                isTyping = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }
        
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        // 初始化
        testConnection();
    </script>
</body>
</html>
